server {
    listen 5171;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static assets: cache aggressively, filenames are content-hashed by Vite.
    location /assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Images and videos keep their names between deploys, so cache for a week and revalidate.
    # nginx serves byte ranges itself, which lets videos start before they are fully downloaded.
    location ~ ^/(images|videos)/ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
    }

    # index.html must always be fresh so a new deploy is picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single-page app: fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
