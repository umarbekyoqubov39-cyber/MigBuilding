<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>MigBuild</title>
    <meta
      name="description"
      content="MigBuild: Farg'ona vodiysida turar-joy, tijorat va sanoat binolarini loyihalash va qurish. Bepul maslahat uchun ariza qoldiring."
    />
    <meta name="theme-color" content="#111111" />
    <meta name="color-scheme" content="dark" />
    <link
      rel="icon"
      type="image/png"
      sizes="64x64"
      href="/images/favicon-64.png"
    />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />

    <!-- Open Graph / social previews. Replace og:image with your own 1200x630 photo before launch. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="uz_UZ" />
    <meta property="og:site_name" content="MigBuild" />
    <meta
      property="og:title"
      content="MigBuild — loyihalashdan kalit topshirishgacha qurilish"
    />
    <meta
      property="og:description"
      content="Turar-joy, tijorat va sanoat binolarini loyihalash va qurish. Bepul maslahat uchun ariza qoldiring."
    />
    <meta
      property="og:image"
      content="https://images.unsplash.com/photo-1541888946425-d81bb19240f5?auto=format&fit=crop&q=70&w=1200&h=630"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Hero poster is the largest above-the-fold image: fetch it before the JS runs. -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/images/hero-poster-960.webp"
      imagesrcset="/images/hero-poster-960.webp 960w, /images/hero-poster-1920.webp 1920w"
      imagesizes="100vw"
      fetchpriority="high"
    />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Saytdan foydalanish uchun JavaScript'ni yoqing.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
